name: Deploy demo to Pages

# Builds the sample-drf demo map with pipeline/build.py and publishes it to GitHub
# Pages. matryoshker.html is gitignored on purpose (docs/data-contract.md: no
# script writes into the target repository, and generated output is never
# committed) — the demo HTML that ends up on Pages exists only as this workflow's
# build output, regenerated on every push to main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install extractor dependencies
        working-directory: extractor
        run: npm ci --ignore-scripts

      - name: Build the demo map
        run: |
          mkdir -p site
          python pipeline/build.py \
            --repo examples/sample-drf \
            --config config/example.json \
            --ucs examples/sample-drf/usecases.json \
            --out site/index.html \
            --lang python

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload demo artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
