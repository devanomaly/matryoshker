<meta charset="utf-8">
<title>Matryoshker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* ---------- theme tokens: light / dark via media query / dark via toggle ---------- */
  :root{
    --paper:#F4F6F5; --panel:#FFFFFF; --panel-2:#EBEFED; --ink:#1C2422; --ink-2:#4A5652; --ink-3:#75817C;
    --line:#D5DCD9; --accent:#2E7D6E; --accent-ink:#1F5A4F; --accent-soft:#DDEBE7;
    --flow:#4a3aa7; --flow-contrast:#FFFFFF;
    --slot1:#2a78d6; --slot2:#eb6834; --slot3:#1baf7a; --slot4:#eda100;
    --slot5:#e87ba4; --slot6:#008300; --gray1:#8a958f; --gray2:#b5beba;
    --ok:#2E7D32; --ok-soft:#E1EFE2; --warn:#9A5B00; --warn-soft:#F5E9D7; --crit:#B3362B; --crit-soft:#F6E2E0;
    --ring:rgba(11,11,11,.18); --dim:.14; --shadow:0 4px 16px rgba(28,36,34,.12);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#141A18; --panel:#1B2320; --panel-2:#222B28; --ink:#E7ECE9; --ink-2:#AEBBB5; --ink-3:#7E8B86;
      --line:#2E3936; --accent:#5BC2AB; --accent-ink:#8AD6C4; --accent-soft:#1F3530;
      --flow:#9085e9; --flow-contrast:#141A18;
      --slot1:#3987e5; --slot2:#d95926; --slot3:#199e70; --slot4:#c98500;
      --slot5:#d55181; --slot6:#008300; --gray1:#6c7873; --gray2:#3a4441;
      --ok:#7FC783; --ok-soft:#1E3220; --warn:#E0A458; --warn-soft:#37290F; --crit:#E28B82; --crit-soft:#3B1F1C;
      --ring:rgba(255,255,255,.16); --dim:.14; --shadow:0 4px 16px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --paper:#141A18; --panel:#1B2320; --panel-2:#222B28; --ink:#E7ECE9; --ink-2:#AEBBB5; --ink-3:#7E8B86;
    --line:#2E3936; --accent:#5BC2AB; --accent-ink:#8AD6C4; --accent-soft:#1F3530;
    --flow:#9085e9; --flow-contrast:#141A18;
    --slot1:#3987e5; --slot2:#d95926; --slot3:#199e70; --slot4:#c98500;
    --slot5:#d55181; --slot6:#008300; --gray1:#6c7873; --gray2:#3a4441;
    --ok:#7FC783; --ok-soft:#1E3220; --warn:#E0A458; --warn-soft:#37290F; --crit:#E28B82; --crit-soft:#3B1F1C;
    --ring:rgba(255,255,255,.16); --dim:.14; --shadow:0 4px 16px rgba(0,0,0,.4);
  }

  /* ---------- base ---------- */
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0; background:var(--paper); color:var(--ink);
       font-family:"Atkinson Hyperlegible",system-ui,sans-serif; font-size:14.5px; line-height:1.5;
       display:flex; flex-direction:column; overflow:hidden;}
  button{font:inherit; color:inherit; background:none; border:none; cursor:pointer}
  button:focus-visible,input:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  /* ---------- header: title, search, legend, toggles ---------- */
  header{display:flex; align-items:center; gap:14px; padding:8px 16px; border-bottom:1px solid var(--line);
         background:var(--panel); flex-wrap:wrap; z-index:5;}
  header h1{font-family:"Bricolage Grotesque",sans-serif; font-size:1.25rem; font-weight:700; margin:0;}
  header .commit{font-family:"IBM Plex Mono",monospace; font-size:.7rem; color:var(--ink-3);}
  #search{flex:1 1 180px; max-width:340px; background:var(--panel-2); border:1px solid var(--line);
          border-radius:8px; padding:6px 12px; color:var(--ink); font-family:"IBM Plex Mono",monospace; font-size:.78rem;}
  .legend{display:flex; gap:10px; flex-wrap:wrap; align-items:center; font-size:.72rem; color:var(--ink-2);}
  .legend .chip{display:inline-flex; align-items:center; gap:5px;}
  .legend .sw{width:10px; height:10px; border-radius:3px; box-shadow:inset 0 0 0 1px var(--ring);}
  label.tgl{display:inline-flex; align-items:center; gap:6px; font-size:.75rem; color:var(--ink-2); cursor:pointer;}

  /* ---------- structure: grid of the three panels ---------- */
  #app{flex:1; display:grid; grid-template-columns:minmax(180px,270px) minmax(0,1fr) minmax(230px,330px); min-height:0;}
  aside{background:var(--panel); overflow-y:auto; min-height:0;}
  #sidebar{border-right:1px solid var(--line);}
  #detail{border-left:1px solid var(--line);}
  aside h2{font-family:"Bricolage Grotesque",sans-serif; font-size:.82rem; letter-spacing:.08em; text-transform:uppercase;
           color:var(--accent-ink); margin:0; padding:12px 14px 6px;}
  h2.sec{cursor:pointer; user-select:none;}
  h2.sec .car{display:inline-block; transition:transform .15s; margin-right:4px; font-size:.7rem;}
  @media (prefers-reduced-motion: reduce){ h2.sec .car{transition:none} }
  h2.sec.closed .car{transform:rotate(-90deg);}

  /* ---------- sidebar: use-cases, status chips, entry points ---------- */
  .uc{display:block; width:100%; text-align:left; padding:8px 14px; border-bottom:1px solid var(--line);
      font-size:.8rem; line-height:1.35;}
  .uc:hover{background:var(--panel-2);}
  .uc.active{background:var(--accent-soft); box-shadow:inset 3px 0 0 var(--flow);}
  .uc .actor{color:var(--ink-3); font-size:.7rem;}
  .badge{display:inline-block; font-family:"IBM Plex Mono",monospace; font-size:.6rem; border-radius:999px;
         padding:1px 7px; background:var(--accent-soft); color:var(--accent-ink); margin-left:4px;}
  .st{display:inline-block; font-family:"IBM Plex Mono",monospace; font-size:.58rem; border-radius:999px;
      padding:1px 7px; margin-left:4px; border:1px solid transparent;}
  .st.human-verified{background:var(--ok-soft); color:var(--ok); border-color:currentColor;}
  .st.agent-verified{background:var(--accent-soft); color:var(--accent-ink);}
  .st.inferred{background:var(--warn-soft); color:var(--warn);}
  .st.hypothesis{background:var(--accent-soft); color:var(--accent-ink); border-style:dashed; border-color:currentColor;}
  .st.outdated{background:var(--crit-soft); color:var(--crit);}
  button.st{cursor:pointer;}
  button.st:hover{border-color:currentColor;}
  select.stsel{cursor:pointer; font-size:.68rem; padding:2px 6px; border-radius:8px; border:1px solid var(--line); margin-left:0;}
  select.stsel option{background:var(--panel); color:var(--ink);}
  .clear{margin:10px 14px; padding:5px 12px; border:1px solid var(--line); border-radius:8px; font-size:.75rem; color:var(--ink-2);}
  .clear:hover{background:var(--panel-2);}
  .kindhdr{padding:7px 14px 2px; font-family:"IBM Plex Mono",monospace; font-size:.62rem; letter-spacing:.07em;
           text-transform:uppercase; color:var(--ink-3); background:var(--panel-2); border-bottom:1px solid var(--line);}
  .ep{display:block; width:100%; text-align:left; padding:5px 14px; font-family:"IBM Plex Mono",monospace;
      font-size:.68rem; border-bottom:1px solid var(--line); color:var(--ink-2);}
  .ep:hover{background:var(--panel-2); color:var(--ink);}
  .ep.active{background:var(--accent-soft); color:var(--ink); box-shadow:inset 3px 0 0 var(--accent);}
  .ep .vw{color:var(--ink-3);}
  .star{display:block; width:100%; text-align:left; padding:6px 14px; font-size:.78rem;
        border-bottom:1px solid var(--line); line-height:1.35;}
  .star:hover{background:var(--panel-2);}
  .star .dot{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px;
             box-shadow:inset 0 0 0 1px var(--ring);}
  .star .starnums{font-family:"IBM Plex Mono",monospace; font-size:.68rem; color:var(--ink-3);}

  /* ---------- map: frame and breadcrumbs ---------- */
  #mapwrap{position:relative; min-width:0; min-height:0; background:var(--paper);}
  #map{width:100%; height:100%; display:block; cursor:grab; touch-action:none;}
  #map.panning{cursor:grabbing;}
  #crumbs{position:absolute; top:10px; left:12px; display:flex; gap:6px; align-items:center; z-index:4;
          font-family:"IBM Plex Mono",monospace; font-size:.72rem; flex-wrap:wrap; max-width:calc(100% - 24px);}
  #crumbs button{padding:4px 12px; border:1px solid var(--line); background:var(--panel); border-radius:8px; color:var(--ink-2);}
  #crumbs button.on{background:var(--accent-soft); color:var(--accent-ink); border-color:var(--accent);}
  #crumbs .crumbfile{color:var(--accent-ink); background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:4px 12px;}

  /* ---------- map, packages scene: nodes per cluster + use-case and import overlays ---------- */
  .cluster{fill:var(--panel); stroke:var(--line); rx:10;}
  .clabel{font-family:"IBM Plex Mono",monospace; font-size:11px; fill:var(--ink-3);}
  .node{stroke:var(--ring); stroke-width:1; rx:2.5; cursor:pointer;}
  .node.dimmed{opacity:var(--dim);}
  .node.sel{stroke:var(--ink); stroke-width:2.5;}
  .node.hit{stroke:var(--accent); stroke-width:2.5;}
  .halo{fill:none; stroke:var(--flow); stroke-width:2.5; pointer-events:none;}
  /* the overlay decorations never take pointer events: they sit on top of the nodes */
  .flowline{fill:none; stroke:var(--flow); stroke-width:2.4; opacity:.9; pointer-events:none;} /* also used by the flow scene */
  .fbadge{pointer-events:none;}
  .fbadge circle{fill:var(--flow); stroke:var(--flow-contrast); stroke-width:1.5;}
  .fbadge text{fill:var(--flow-contrast); font-family:"IBM Plex Mono",monospace; font-size:10px; font-weight:700;
               text-anchor:middle; dominant-baseline:central;}
  .edge-in{fill:none; stroke:var(--ink-3); stroke-width:1.4; stroke-dasharray:4 3; opacity:.8; pointer-events:none;}
  .edge-out{fill:none; stroke:var(--accent); stroke-width:1.6; opacity:.85; pointer-events:none;}

  /* ---------- map, context scene: cluster boxes + aggregated imports ---------- */
  .ctxbox{fill:var(--panel); stroke:var(--line); rx:12; cursor:pointer;}
  .ctxbox.dimmed{opacity:.25;}
  .ctxstripe{rx:2;}
  .ctxlabel{font-family:"IBM Plex Mono",monospace; font-size:12px; fill:var(--ink); pointer-events:none;}
  .ctxcount{font-family:"IBM Plex Mono",monospace; font-size:10px; fill:var(--ink-3); pointer-events:none;} /* also a tspan in the symbols scene */
  .aggedge{fill:none; stroke:var(--ink-3); opacity:.4;}
  .aggedge:hover{stroke:var(--accent); opacity:.9;}

  /* ---------- map, symbols scene: classes, symbol pills, stubs and calls ---------- */
  .classbox{fill:var(--panel-2); stroke:var(--line); rx:8;}
  .classhdr{font-family:"IBM Plex Mono",monospace; font-size:11px; font-weight:700; fill:var(--ink);} /* also the title of the flow scene */
  .pill{stroke:var(--ring); stroke-width:1; rx:9; cursor:pointer; fill:var(--panel);}
  .pill.sel{stroke:var(--accent); stroke-width:2.2;}
  .pill.dimmed{opacity:.25;}
  .pilltext{font-family:"IBM Plex Mono",monospace; font-size:10px; fill:var(--ink-2); pointer-events:none;}
  .stub{fill:var(--panel); stroke:var(--line); stroke-dasharray:5 3; rx:8; cursor:pointer;}
  .stubtext{font-family:"IBM Plex Mono",monospace; font-size:10px; fill:var(--accent-ink); pointer-events:none;}
  .calledge{fill:none; stroke:var(--ink-3); stroke-width:1.2; opacity:.35;}
  .calledge.out{stroke:var(--accent); stroke-width:1.8; opacity:.95;}
  .calledge.in{stroke:var(--ink-2); stroke-width:1.6; stroke-dasharray:4 3; opacity:.9;}
  .calledge.faded{opacity:.06;}

  /* ---------- map, flow scene: nodes of the hop chain / call tree ---------- */
  .flownode{fill:var(--panel); stroke-width:2;}
  .flowt1{font-family:"IBM Plex Mono",monospace; font-size:11px; fill:var(--ink); pointer-events:none;}
  .flowt2{font-family:"IBM Plex Mono",monospace; font-size:9.5px; fill:var(--ink-3); pointer-events:none;}

  /* ---------- map: controls (zoom, hint, tooltip) ---------- */
  #zoomctl{position:absolute; bottom:14px; right:14px; display:flex; flex-direction:column; gap:6px;}
  #zoomctl button{width:32px; height:32px; background:var(--panel); border:1px solid var(--line); border-radius:8px;
                  font-size:1rem; box-shadow:var(--shadow);}
  #hint{position:absolute; bottom:14px; left:14px; font-size:.68rem; color:var(--ink-3);
        font-family:"IBM Plex Mono",monospace;}
  #tip{position:absolute; pointer-events:none; background:var(--ink); color:var(--paper); font-family:"IBM Plex Mono",monospace;
       font-size:.68rem; padding:4px 8px; border-radius:6px; opacity:0; max-width:380px; z-index:9;}

  /* ---------- search: results dropdown ---------- */
  #results{position:absolute; top:2px; left:0; right:0; margin:0 auto; max-width:420px; background:var(--panel);
           border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); z-index:8; display:none;
           max-height:320px; overflow-y:auto;}
  #results button{display:block; width:100%; text-align:left; padding:6px 12px; font-family:"IBM Plex Mono",monospace;
                  font-size:.72rem; border-bottom:1px solid var(--line);}
  #results button:hover{background:var(--panel-2);}
  #results .k{color:var(--ink-3); margin-right:6px;}

  /* ---------- detail panel ---------- */
  #detail .body{padding:10px 14px 30px; font-size:.8rem;}
  #detail .path{font-family:"IBM Plex Mono",monospace; font-size:.72rem; color:var(--accent-ink); word-break:break-all;}
  #detail h3{font-family:"Bricolage Grotesque",sans-serif; font-size:.78rem; margin:14px 0 4px; color:var(--ink-2);
             text-transform:uppercase; letter-spacing:.06em;}
  #detail ul{margin:4px 0; padding-left:16px;}
  #detail li{margin:2px 0;}
  #detail .sym{font-family:"IBM Plex Mono",monospace; font-size:.72rem;}
  #detail .muted{color:var(--ink-3);}
  #detail a.filelink,#detail a.symlink{color:var(--accent-ink); cursor:pointer; text-decoration:underline; text-decoration-color:var(--line);}
  .opensym{margin:10px 6px 0 0; padding:5px 12px; border:1px solid var(--accent); border-radius:8px;
           color:var(--accent-ink); font-size:.75rem;}
  .opensym:hover{background:var(--accent-soft);}
  .hoprow{display:flex; gap:8px; margin:6px 0; align-items:baseline; cursor:pointer;}
  .hoprow:hover .hr-role{color:var(--ink);}
  .hopn{flex:0 0 auto; width:18px; height:18px; border-radius:50%; background:var(--flow); color:var(--flow-contrast);
        font-family:"IBM Plex Mono",monospace; font-size:.62rem; font-weight:700; display:flex; align-items:center; justify-content:center;}
  .hr-sym{font-family:"IBM Plex Mono",monospace; font-size:.7rem; color:var(--accent-ink); word-break:break-all;}
  .hr-role{font-size:.72rem; color:var(--ink-2);}
  .empty{padding:20px 14px; color:var(--ink-3); font-size:.78rem;}
</style>

<header>
  <h1>Matryoshker</h1>
  <span class="commit" id="commitline"></span>
  <input id="search" type="search" data-t-ph="search.placeholder" autocomplete="off" spellcheck="false">
  <label class="tgl" id="mutedtgl" hidden><input type="checkbox" id="tgtests"> <span id="mutedlabel"></span></label>
  <label class="tgl" id="starstgl"><input type="checkbox" id="tgstars"> <span data-t="toggle.stars"></span></label>
  <div class="legend" id="legend"></div>
</header>

<div id="app">
  <aside id="sidebar">
    <h2 class="sec closed" id="ephdr" hidden><span class="car">&#9662;</span><span data-t="panel.entry_points"></span> <span class="badge" id="epn"></span></h2>
    <div id="eplist" hidden></div>
    <h2 class="sec closed" id="starhdr"><span class="car">&#9662;</span><span data-t="panel.stars"></span> <span class="badge" id="starn"></span></h2>
    <div id="starlist" hidden></div>
    <h2 class="sec" id="uchdr"><span class="car">&#9662;</span><span data-t="panel.usecases"></span> <span class="badge" id="ucn"></span></h2>
    <div id="ucwrap">
      <div id="uclist"></div>
      <button class="clear" id="ucclear" data-t="uc.clear" hidden></button>
      <button class="clear" data-exportst="1" data-t-title="uc.export_title"></button>
    </div>
  </aside>

  <div id="mapwrap">
    <div id="crumbs">
      <button id="bctx" data-t="crumb.context"></button>
      <button id="bpac" class="on" data-t="crumb.packages"></button>
      <button id="bflow" data-t="crumb.flow" hidden></button>
      <span class="crumbfile" id="bfile" hidden></span>
      <button class="crumbfile" id="bep" data-t-title="crumb.entry_point_title" hidden></button>
      <button class="crumbfile" id="btree" data-t-title="crumb.call_tree_title" hidden></button>
      <button class="crumbfile" id="bhid" data-t-title="crumb.hidden_title" hidden></button>
    </div>
    <svg id="map" role="application" data-t-aria="map.aria">
      <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--flow)"/>
        </marker>
        <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--ink-3)"/>
        </marker>
        <marker id="arra" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
        </marker>
      </defs>
      <g id="world"></g>
    </svg>
    <div id="results"></div>
    <div id="zoomctl">
      <button id="zin" data-t-aria="zoom.in">+</button>
      <button id="zout" data-t-aria="zoom.out">&#8722;</button>
      <button id="zfit" data-t-aria="zoom.fit" data-t-title="zoom.fit">&#10530;</button>
    </div>
    <div id="hint" data-t="hint"></div>
    <div id="tip"></div>
  </div>

  <aside id="detail">
    <h2 id="dtitle"></h2>
    <div class="body" id="dbody"><div class="empty" data-t="detail.empty"></div></div>
  </aside>
</div>

<script type="application/json" id="data">__MATRYOSHKER_DATA__</script>
<script>
(function(){

const DATA = JSON.parse(document.getElementById('data').textContent);

// group order of the entry-point panel; the pipeline sorts entry_points the same way
const KINDS = ['http', 'command', 'event', 'cli', 'cron', 'other'];

// ==================== layout and geometry ====================
const NODE = 13, GAP = 5, PAD = 14, LABELH = 20;

// '(root)' is an identifier, not prose: it is also a localStorage key, so it is the
// same string in every language.
function clusterKey(p){
  const seg = p.split('/');
  if (seg.length === 1) return '(root)';
  if (seg.length === 2) return seg[0];
  return seg[0] + '/' + seg[1];
}
function visible(i){ return showMuted || !isMutedCat(F[i].g); }
function pillW(s){ return Math.max(46, s.length*6.6+16); }
const nodeCenter = i => pos[i] ? {x: pos[i].x+NODE/2, y: pos[i].y+NODE/2} : null;
// horizontal cubic curve between pills (symbols scene)
function edgePath(a, b){
  const ax=a.x+a.w, ay=a.y+9, bx=b.x, by=b.y+9;
  const mx=(ax+bx)/2;
  return `M${ax},${ay} C${mx},${ay} ${mx},${by} ${bx},${by}`;
}
// quadratic curve with a perpendicular belly proportional to the distance
function liftedCurve(a, b, maxLift, frac){
  const mx=(a.x+b.x)/2, my=(a.y+b.y)/2, dx=b.x-a.x, dy=b.y-a.y;
  const L=Math.hypot(dx,dy)||1, lift=Math.min(maxLift, L*frac);
  return `M${a.x},${a.y} Q${mx-dy/L*lift},${my+dx/L*lift} ${b.x},${b.y}`;
}
// groups the visible files per directory and places every node (fills `pos`); returns the clusters
function layoutPac(){
  pos = new Array(F.length).fill(null);
  const groups = new Map();
  F.forEach((f,i)=>{
    if (!visible(i)) return;
    const key = clusterKey(f.p);
    (groups.get(key) ?? groups.set(key,[]).get(key)).push(i);
  });
  const cls = [...groups.entries()].map(([key,idxs])=>{
    idxs.sort((a,b)=> F[a].g === F[b].g ? (F[a].p < F[b].p ? -1:1) : (F[a].g < F[b].g ? -1:1));
    const n = idxs.length;
    const cols = Math.max(2, Math.ceil(Math.sqrt(n*1.6)));
    return {key, idxs, cols,
      w: cols*(NODE+GAP)-GAP+2*PAD,
      h: Math.ceil(n/cols)*(NODE+GAP)-GAP+2*PAD+LABELH};
  }).sort((a,b)=> b.idxs.length - a.idxs.length);
  const MAXW = 1500, CGAP = 26;
  let x=0,y=0,rowH=0;
  for (const c of cls){
    if (x > 0 && x + c.w > MAXW){ x = 0; y += rowH + CGAP; rowH = 0; }
    c.x = x; c.y = y;
    x += c.w + CGAP; rowH = Math.max(rowH, c.h);
    c.idxs.forEach((fi,j)=>{
      pos[fi] = { x: c.x+PAD + (j%c.cols)*(NODE+GAP),
                  y: c.y+PAD+LABELH + Math.floor(j/c.cols)*(NODE+GAP) };
      if (activeUC >= 0){
        const o = offs.pac.get(activeUC + ':' + fi);
        if (o){ pos[fi].x += o.dx; pos[fi].y += o.dy; }
      }
    });
  }
  return cls;
}

// ==================== flow source ====================
// The use-case overlay and the entry-point lens are meant to coexist (Context combines
// them), so the Flow scene follows the selection made LAST instead of a fixed
// precedence. `flowPick` is that pointer; this resolver keeps it on a selection that is
// still active. Pure on purpose (arguments only): it is unit-tested outside the browser.
function resolveFlowPick(pick, live){
  if (pick && live[pick]) return pick;
  if (live.ep) return 'ep';
  if (live.tree) return 'tree';
  if (live.uc) return 'uc';
  return null;
}

function entryReach(){
  // BFS of depth 2 over imports, starting at the file of the active entry point
  if (activeEp < 0) return null;
  const seen = new Set([ENTRY_POINTS[activeEp].i]);
  let frontier = [ENTRY_POINTS[activeEp].i];
  for (let d = 0; d < 2; d++){
    const next = [];
    for (const f of frontier) for (const t0 of (outAdj.get(f) || []))
      if (!seen.has(t0)){ seen.add(t0); next.push(t0); }
    frontier = next;
  }
  return seen;
}

// packages-scene overlay: dim/selection/hits + trail of the active UC + import edges of the selected file
function paintState(){

    for (const h of UCS[activeUC].hops) if (pos[h.i]) ucSet.add(h.i);

    }

function renderCtx(){

  // hidden clusters (this scene only): out of the boxes AND of the aggregated edges (bkey does not resolve them)
  const boxes = clusters.filter(c=>!hiddenCks.has(c.key)).map(c=>{
    const domCat = (()=>{ const cnt={}; c.idxs.forEach(i=>cnt[F[i].g]=(cnt[F[i].g]||0)+1);
      return Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0][0]; })();
    return {key:c.key, n:c.idxs.length, domCat, idxs:c.idxs,
            w: Math.max(96, c.key.length*7.5+30), h: 52};
  });
  const MAXW = 900, CG = 60, RG = 80;
  let x=0,y=0,rowH=0;
  for (const b of boxes){
    if (x > 0 && x + b.w > MAXW){ x=0; y += rowH + RG; rowH = 0; }
    b.x=x; b.y=y; x += b.w + CG; rowH = Math.max(rowH, b.h);
    const o = offs.ctx.get(b.key);
    if (o){ b.x += o.dx; b.y += o.dy; }

    agg.set(key, (agg.get(key)||0)+1);

    if (!A || !B) continue;
    const ctrA = {x:A.x+A.w/2, y:A.y+A.h/2}, ctrB = {x:B.x+B.w/2, y:B.y+B.h/2};
    const w = 1 + Math.log2(n);

function renderFile(){
  const f = F[fileFocus];
  const cd = callsOf(fileFocus);
  let s = '', y = 0;
  const COLW = 640;
  // free functions
  if (f.f.length){
    let x = 0;
    s += `<text class="classhdr" x="0" y="${y+12}">${esc(t('file.functions'))}</text>`; y += 22;
    for (const fn of f.f){
      const w = pillW(fn[0]);
      if (x > 0 && x + w > COLW){ x = 0; y += 26; }
      const o = offs.file.get(fileFocus + ':' + fn[0]) || {dx:0,dy:0};
      const sp = {x: x+o.dx, y: y+o.dy, w};
      symPos.set(fn[0], sp);
      s += `<rect class="pill" data-sym="${esc(fn[0])}" x="${sp.x}" y="${sp.y}" width="${w}" height="19"/>` +
           `<text class="pilltext" x="${sp.x+8}" y="${sp.y+13}">${esc(fn[0])}</text>`;
      x += w + 8;
    }
    y += 40;
  }
  // classes with method pills
  for (const c of f.c){
    const hdrY = y;
    y += 26; let x = 12, boxH = 26;
    const rows = [];
    for (const m of c[3]){
      const w = pillW(m);
      if (x > 12 && x + w > COLW-12){ x = 12; y += 26; boxH += 26; }
      rows.push({m, x, y, w});
      x += w + 8;
    }
    boxH += c[3].length ? 30 : 8;
    s += `<rect class="classbox" x="0" y="${hdrY}" width="${COLW}" height="${boxH+18}"/>` +
         `<text class="classhdr" x="12" y="${hdrY+18}">${esc(c[0])} <tspan class="ctxcount">:${c[1]}–${c[2]}</tspan></text>`;
    for (const r of rows){
      const o = offs.file.get(fileFocus + ':' + r.m) || {dx:0,dy:0};
      const xx = r.x + o.dx, yy = r.y + 8 + o.dy;
      symPos.set(r.m, {x:xx, y:yy, w:r.w});
      s += `<rect class="pill" data-sym="${esc(r.m)}" x="${xx}" y="${yy}" width="${r.w}" height="19"/>` +
           `<text class="pilltext" x="${xx+8}" y="${yy+13}">${esc(r.m)}</text>`;
    }
    y = hdrY + boxH + 18 + 16;
  }
  // stubs: imported files referenced by cross-file calls
  const stubX = COLW + 120;
  const tgts = [...new Set(cd.x.map(e=>e[1]))];
  let sy = 0;
  s += tgts.length ? `<text class="classhdr" x="${stubX}" y="12">${esc(t('file.calls_other'))}</text>` : '';
  for (const t0 of tgts){
    const label = baseName(F[t0].p);
    const w = pillW(label) + 12;
    const o = offs.file.get(fileFocus + ':stub:' + t0) || {dx:0,dy:0};
    const sxx = stubX + o.dx, syy = 24 + sy + o.dy;
    stubPos.set(t0, {x: sxx, y: syy, w});
    s += `<rect class="stub" data-stub="${t0}" x="${sxx}" y="${syy}" width="${w}" height="22"/>` +
         `<text class="stubtext" x="${sxx+8}" y="${syy+15}">${esc(label)}</text>`;
    sy += 32;
  }
  s += `<g id="fedges"></g>`;
  world.innerHTML = s;
  paintFileEdges();
}
// call edges of the symbols scene + highlight of the selected symbol
function paintFileEdges(){
  const cd = callsOf(fileFocus);
  const g = world.querySelector('#fedges');
  if (!g) return;
  let s = '';
  const rel = e => selSym && (e[0] === selSym);
  const relIn = e => selSym && (e[1] === selSym);
  for (const e of cd.n){
    const a = symPos.get(e[0]), b = symPos.get(e[1]);
    if (!a || !b || e[0] === e[1]) continue;
    const cls = !selSym ? 'calledge' : rel(e) ? 'calledge out' : relIn(e) ? 'calledge in' : 'calledge faded';
    const mk = cls.includes('out') ? 'arra' : 'arrg';
    s += `<path class="${cls}" marker-end="url(#${mk})" d="${edgePath(a,b)}"><title>${esc(e[0])} → ${esc(e[1])} :${e[2]}</title></path>`;
  }
  for (const e of cd.x){
    const a = symPos.get(e[0]), b = stubPos.get(e[1]);
    if (!a || !b) continue;
    const cls = !selSym ? 'calledge' : (e[0] === selSym ? 'calledge out' : 'calledge faded');
    s += `<path class="${cls}" marker-end="url(#${cls.includes('out')?'arra':'arrg'})" d="${edgePath(a,b)}"><title>${esc(e[0])} → ${esc(e[2])} (${esc(baseName(F[e[1]].p))}) :${e[3]}</title></path>`;
  }
  g.innerHTML = s;
  world.querySelectorAll('.pill').forEach(el=>{
    el.classList.toggle('sel', el.dataset.sym === selSym);
    el.classList.toggle('dimmed', !!selSym && el.dataset.sym !== selSym &&
      !cd.n.some(e=>(e[0]===selSym&&e[1]===el.dataset.sym)||(e[1]===selSym&&e[0]===el.dataset.sym)));
  });
}
// cross-file call tree rooted at a file (optionally at one of its symbols)
const TREE_DEPTH = 3;
function callTreeSvg(rootI, rootSym){
  const NODEW=176, NODEH=34, LX=24, LY=88, MAXCH=8;
  const visited = new Set();
  function build(fi, d, sym){
    visited.add(fi);
    const kids = []; let extra = 0;
    if (d < TREE_DEPTH){
      let edges = callsOf(fi).x || [];
      // only the root can be narrowed to one symbol; deeper levels are file-level
      if (sym) edges = edges.filter(e=>e[0] === sym);
      const tg = [...new Set(edges.map(e=>e[1]))].filter(t0=>!visited.has(t0));
      for (const t0 of tg.slice(0, MAXCH)) kids.push(build(t0, d+1, null));
      extra = Math.max(0, tg.length - MAXCH);
    }
    const w = kids.length ? kids.reduce((a,c)=>a+c.w, 0) + LX*(kids.length-1) : NODEW;
    return {fi, kids, w, extra};
  }
  const root = build(rootI, 0, rootSym || null);
  (function place(n, x, y){
    n.x = x + n.w/2 - NODEW/2; n.y = y;
    let cx = x;
    for (const c of n.kids){ place(c, cx, y + LY); cx += c.w + LX; }
  })(root, 0, 24);
  let s = '';
  (function draw(n){
    for (const c of n.kids){
      s += `<path class="calledge" marker-end="url(#arrg)" d="M${n.x+NODEW/2},${n.y+NODEH} C${n.x+NODEW/2},${n.y+NODEH+34} ${c.x+NODEW/2},${c.y-34} ${c.x+NODEW/2},${c.y}" style="opacity:.7"/>`;
      draw(c);
    }
    const f = F[n.fi];
    const label = baseName(f.p);
    s += `<g data-i="${n.fi}" style="cursor:pointer">
      <rect class="flownode" x="${n.x}" y="${n.y}" width="${NODEW}" height="${NODEH}" rx="8" style="stroke:${CATCOLOR(f.g)}"/>
      <text class="flowt1" x="${n.x+10}" y="${n.y+21}">${esc(label.length>23 ? label.slice(0,22)+'…' : label)}</text></g>`;
    if (n.extra) s += `<text class="flowt2" x="${n.x+NODEW+5}" y="${n.y+21}">+${n.extra}</text>`;
  })(root);
  return s;
}
// the Flow scene draws whichever selection `flowPick` names (the most recent one)
function renderFlow(){
  let s = '';
  if (flowPick === 'uc'){
    // use-case flow: hops in a vertical column
    const u = UCS[activeUC];
    const W = 470, X = 0;
    let y = 0;
    u.hops.forEach((h, idx)=>{
      const f = F[h.i];
      const label = baseName(f.p) + (h.s ? ' : ' + h.s : '');
      const role = h.r.length > 66 ? h.r.slice(0, 65) + '…' : h.r;
      s += `<g data-i="${h.i}" style="cursor:pointer">
        <rect class="flownode" x="${X}" y="${y}" width="${W}" height="46" rx="9" style="stroke:${CATCOLOR(f.g)}"/>
        <text class="flowt1" x="${X+12}" y="${y+19}">${idx+1}. ${esc(label)}</text>
        <text class="flowt2" x="${X+12}" y="${y+36}">${esc(role)}</text></g>`;
      if (idx < u.hops.length - 1)
        s += `<path class="flowline" marker-end="url(#arr)" d="M${X+W/2},${y+46} L${X+W/2},${y+63}"/>`;
      y += 64;
    });
    s = `<text class="classhdr" x="0" y="-18">${esc(u.name)}</text>` + s;
  } else if (flowPick === 'ep'){
    // entry point: call tree from the file where execution enters
    const ep = ENTRY_POINTS[activeEp];
    const label = ep.label + (ep.symbol ? ' · ' + ep.symbol : '');
    s = `<text class="classhdr" x="0" y="0">${esc(t('flow.call_tree_title', {label, d: TREE_DEPTH}))}</text>` +
        callTreeSvg(ep.i, null);
  } else if (flowPick === 'tree'){
    // call tree launched from the symbols scene
    const label = baseName(F[treeRoot.i].p) + (treeRoot.symbol ? ' · ' + treeRoot.symbol : '');
    s = `<text class="classhdr" x="0" y="0">${esc(t('flow.call_tree_title', {label, d: TREE_DEPTH}))}</text>` +
        callTreeSvg(treeRoot.i, treeRoot.symbol);
  } else {
    s = `<text class="classhdr" x="0" y="0">${esc(t('flow.empty'))}</text>`;
  }
  world.innerHTML = s;
  // a new Flow source replaces the whole drawing: refit so it is actually on screen
  const sig = flowPick === 'uc' ? 'uc:' + activeUC
            : flowPick === 'ep' ? 'ep:' + activeEp
            : flowPick === 'tree' ? 'tree:' + treeRoot.i + ':' + (treeRoot.symbol || '')
            : '';
  if (sig !== flowDrawn && fit()) flowDrawn = sig;   // a bailed fit stays pending, and is retried
}

// ==================== scene navigation ====================
function go(sc, opts={}){
  scene = sc;
  if (sc === 'file' && opts.i != null){ fileFocus = opts.i; selSym = opts.sym || null; }
  if (sc !== 'file') selSym = null;
  render();
  fit();
  if (sc === 'file') fileDetail();
}
document.getElementById('bctx').onclick = ()=> go('ctx');
document.getElementById('bpac').onclick = ()=> go('pac');
document.getElementById('bflow').onclick = ()=> go('flow');
document.getElementById('bep').addEventListener('click', ()=>{ activeEp = -1; render(); });
document.getElementById('btree').addEventListener('click', ()=>{ treeRoot = null; render(); });
document.getElementById('bhid').addEventListener('click', ()=>{ hiddenCks.clear(); saveHidden(); render(); });
// Esc goes up one level: search results > selected symbol > symbols/flow scene >
// entry point or call tree root > selected file > active use-case > context
document.addEventListener('keydown', e=>{
  if (e.key !== 'Escape') return;
  if (results.style.display === 'block'){ results.style.display='none'; input.value=''; searchHits=new Set(); paintState(); }
  else if (scene === 'file' && selSym){ selSym = null; paintFileEdges(); fileDetail(); }
  else if (scene === 'file' || scene === 'flow'){ go('pac'); }
  else if (activeEp >= 0){ activeEp = -1; render(); }
  else if (treeRoot){ treeRoot = null; render(); }
  else if (selected >= 0){ selected = -1; paintState(); }
  else if (activeUC >= 0) setUC(-1);
  else if (scene !== 'ctx') go('ctx');
});

// ==================== map interaction (pan / zoom / drag / hover / click) ====================
function apply(){ world.setAttribute('transform', `translate(${tx},${ty}) scale(${k})`); }
// Returns true when a transform was applied, false when there was nothing to fit yet
// (no bounding box, or the SVG has no layout width — a hidden or zero-sized container).
// The return value is additive: callers that ignore it behave exactly as before.
function fit(){
  let bb;
  try { bb = world.getBBox(); } catch(e){ return false; }
  const W = svg.clientWidth, H = svg.clientHeight;
  if (!bb.width || !W) return false;
  k = Math.min(W/(bb.width+60), H/(bb.height+60), 2.2);
  tx = (W - bb.width*k)/2 - bb.x*k;
  ty = (H - bb.height*k)/2 - bb.y*k;
  apply();
  return true;
}
function centerOn(i){
  const c = nodeCenter(i);
  if (!c) return;
  k = Math.max(k, 1.4);
  tx = svg.clientWidth/2 - c.x*k;
  ty = svg.clientHeight/2 - c.y*k;
  apply();
}
svg.addEventListener('wheel', e=>{
  e.preventDefault();
  const f = Math.exp(-e.deltaY*0.0012);
  const nk = Math.min(8, Math.max(0.12, k*f));
  const r = svg.getBoundingClientRect(), px = e.clientX-r.left, py = e.clientY-r.top;
  tx = px - (px-tx)*(nk/k); ty = py - (py-ty)*(nk/k); k = nk; apply();
}, {passive:false});
document.getElementById('zin').onclick = ()=>{ k=Math.min(8,k*1.35); apply(); };
document.getElementById('zout').onclick = ()=>{ k=Math.max(0.12,k/1.35); apply(); };
document.getElementById('zfit').onclick = fit;

let pan = null, downEl = null, lastHit = null, drag = null, rafPending = false; // transient state of the current gesture
function sceneRerender(){
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(()=>{ rafPending = false; render(); });
}
function dragTargetFor(el){
  // dragging: always in Context and Symbols; in Packages only with an active UC (per-UC arrangement)
  if (!el) return null;
  if (scene === 'ctx' && el.dataset.ck != null) return {map:'ctx', key: el.dataset.ck};
  if (scene === 'file' && el.dataset.sym != null) return {map:'file', key: fileFocus + ':' + el.dataset.sym};
  if (scene === 'file' && el.dataset.stub != null) return {map:'file', key: fileFocus + ':stub:' + el.dataset.stub};
  if (scene === 'pac' && el.dataset.i != null && activeUC >= 0 &&
      UCS[activeUC].hops.some(h=>h.i === +el.dataset.i))
    return {map:'pac', key: activeUC + ':' + el.dataset.i};
  return null;
}
svg.addEventListener('pointerdown', e=>{
  // stash the target NOW: setPointerCapture retargets pointerup to the svg
  downEl = e.target.closest('[data-hidectx],[data-i],[data-sym],[data-stub],[data-ck]');
  lastHit = downEl;
  const dt = dragTargetFor(downEl);
  if (dt){
    const base = offs[dt.map].get(dt.key) || {dx:0, dy:0};
    drag = {...dt, sx:e.clientX, sy:e.clientY, bdx:base.dx, bdy:base.dy};
  } else {
    pan = {x:e.clientX, y:e.clientY, tx, ty};
  }
  svg.classList.add('panning'); svg.setPointerCapture(e.pointerId);
});
svg.addEventListener('pointermove', e=>{
  if (drag && (e.buttons & 1)){
    offs[drag.map].set(drag.key, {dx: drag.bdx + (e.clientX-drag.sx)/k, dy: drag.bdy + (e.clientY-drag.sy)/k});
    sceneRerender();
  }
  else if (pan && (e.buttons & 1)){ tx = pan.tx + (e.clientX-pan.x); ty = pan.ty + (e.clientY-pan.y); apply(); }
  else {
    const el = e.target.closest('.node');
    if (el){
      const f = F[+el.dataset.i];
      tip.textContent = t('tip.file', {path: f.p, n: f.n});
      tip.style.opacity = 1;
      const r = document.getElementById('mapwrap').getBoundingClientRect();
      tip.style.left = Math.min(e.clientX-r.left+14, r.width-tip.offsetWidth-8)+'px';
      tip.style.top = (e.clientY-r.top+14)+'px';
    } else tip.style.opacity = 0;
  }
});
svg.addEventListener('pointerup', e=>{
  svg.classList.remove('panning');
  const start = drag ? {x:drag.sx, y:drag.sy} : pan;
  const moved = start && (Math.abs(e.clientX-start.x)+Math.abs(e.clientY-start.y) > 5);
  if (drag && moved) saveOffs();
  pan = null; drag = null;
  const el = downEl; downEl = null;
  if (moved || !el) return;
  // the folder-hiding cross consumes the click before the box click (which navigates to Packages)
  if (el.dataset.hidectx != null){ hiddenCks.add(el.dataset.hidectx); saveHidden(); render(); return; }
  if (el.dataset.i != null) selectFile(+el.dataset.i);
  else if (el.dataset.sym != null){ selSym = (selSym === el.dataset.sym ? null : el.dataset.sym); paintFileEdges(); symDetail(); }
  else if (el.dataset.stub != null) selectFile(+el.dataset.stub);
  else if (el.dataset.ck != null){ go('pac'); }
});
svg.addEventListener('dblclick', e=>{
  // pointer capture retargets dblclick to the svg, so fall back to the last node pressed
  const el = e.target.closest('[data-i],[data-stub]') ||
             (lastHit && lastHit.closest('[data-i],[data-stub]'));
  if (!el) return;
  const i = el.dataset.i != null ? +el.dataset.i : +el.dataset.stub;
  go('file', {i});
});
svg.addEventListener('pointerleave', ()=> tip.style.opacity = 0);

function entryDetail(j){
  const ep = ENTRY_POINTS[j], f = F[ep.i];
  dtitle.textContent = t('detail.entry_point');
  dbody.innerHTML = `<strong>${esc(ep.label)}</strong>
    <div class="muted">${esc(t('kind.' + ep.kind))}</div>` +
    (ep.symbol ? `<div class="sym">${esc(ep.symbol)}</div>` : '') +
    `<div class="path">${esc(f.p)}</div>
    <div class="sym">${fileLink(ep.i)}</div>`;
}
dbody.addEventListener('change', e=>{
  const sel = e.target.closest('[data-stsel]');
  if (sel && activeUC >= 0){
    const u = UCS[activeUC];
    const next = sel.value;
    if (next === canonStatus(u.status)) delete stOverrides[u.name];
    else stOverrides[u.name] = next;
    saveSt(); refreshUCChips(); setUC(activeUC, {pick: false});   // repaint only
  }
});
dbody.addEventListener('click', e=>{
  const su = e.target.closest('[data-setuc]');
  if (su){ setUC(+su.dataset.setuc); return; }
  const ct = e.target.closest('[data-tree]');
  if (ct){
    // launcher of the Flow scene from the symbols scene: file level, or one symbol of it
    treeRoot = {i: fileFocus, symbol: ct.dataset.tree === 'sym' ? selSym : null};
    activeEp = -1;
    flowPick = 'tree';
    go('flow');
    return;
  }
  const a = e.target.closest('[data-go]');
  if (a){ const i = +a.dataset.go; if (scene!=='pac') go('pac'); selectFile(i); centerOn(i); return; }
  const o = e.target.closest('[data-open]');
  if (o){ go('file', {i:+o.dataset.open}); return; }
  const of2 = e.target.closest('[data-openfile]');
  if (of2){ go('file', {i:+of2.dataset.openfile}); return; }
  const ss = e.target.closest('[data-selsym]');
  if (ss){ selSym = ss.dataset.selsym; paintFileEdges(); symDetail(); return; }
  const hr = e.target.closest('[data-hop]');
  if (hr){ const i = +hr.dataset.hop; if (scene!=='pac') go('pac'); selected = i; paintState(); centerOn(i); }
});

// ==================== use-cases panel ====================
document.getElementById('ucn').textContent = UCS.length;
// collapsible section (same pattern as the entry-points header); open by default, not persisted
document.getElementById('uchdr').addEventListener('click', function(){
  this.classList.toggle('closed');
  const w = document.getElementById('ucwrap');
  w.hidden = !w.hidden;
});
uclist.innerHTML = UCS.map((u,j)=>
  `<button class="uc" data-j="${j}">${esc(u.name)}<br><span class="actor">${esc(u.actor)}</span>` +
  (u.seam ? `<span class="badge">${esc(t('badge.seam'))}</span>` : '') +
  `<span class="st ${esc(ucStatus(u))}">${esc(ucStatus(u))}</span></button>`).join('');
function refreshUCChips(){
  uclist.querySelectorAll('.uc').forEach((el,i)=>{
    const chip = el.querySelector('.st');
    if (chip){ chip.className = 'st ' + ucStatus(UCS[i]); chip.textContent = ucStatus(UCS[i]); }
  });
  // local drafts visible without opening one use-case at a time: a counter on the export button
  const btn = document.querySelector('#sidebar [data-exportst]');
  if (btn){
    const n = Object.keys(stOverrides).length;
    btn.textContent = n ? t('uc.export_n', {n}) : t('uc.export');
  }
}
uclist.addEventListener('click', e=>{
  const b = e.target.closest('.uc'); if (!b) return;
  const j = +b.dataset.j;
  setUC(j === activeUC ? -1 : j);
});
// opts.pick === false repaints the panel for the use-case already active without
// claiming the Flow source (the status-change refresh); a real selection omits it.
function setUC(j, opts={}){
  activeUC = j;
  if (j >= 0 && opts.pick !== false) flowPick = 'uc';
  uclist.querySelectorAll('.uc').forEach((el,i)=> el.classList.toggle('active', i===j));
  ucclear.hidden = j < 0;
  if (j >= 0){
    if (scene === 'file') go('pac');
    const u = UCS[j];
    dtitle.textContent = t('detail.usecase');
    const order = new Map();
    u.hops.forEach(h=>{ if(pos[h.i] && !order.has(h.i)) order.set(h.i, order.size+1); });
    const st = ucStatus(u);
    dbody.innerHTML = `<strong>${esc(u.name)}</strong>
      <div class="muted">${esc(u.actor)}${u.seam ? ' · ' + esc(t('detail.seam')) : ''}</div>
      <div style="display:flex;align-items:center;gap:6px">
        <select class="stsel st ${esc(st)}" data-stsel title="${esc(t('detail.status_title'))}">` +
        ST_CYCLE.map(s0=>`<option value="${s0}"${s0===st?' selected':''}>${s0}</option>`).join('') +
        `</select>${stOverrides[u.name] ? `<span class="muted" style="font-size:.65rem">${esc(t('detail.local'))}</span>` : ''}</div>
      <p style="font-size:.78rem">${esc(u.goal)}</p>
      <h3>${esc(t('detail.hops', {n:u.hops.length}))}</h3>` +
      u.hops.map(h=>`<div class="hoprow" data-hop="${h.i}">
          <span class="hopn">${order.get(h.i)||'·'}</span>
          <span><span class="hr-sym">${esc(baseName(F[h.i].p))}${h.s? ' : '+esc(h.s):''}</span><br>
          <span class="hr-role">${esc(h.r)}</span></span></div>`).join('') +
      (u.rules.length ? `<h3>${esc(t('detail.rules'))}</h3><div class="sym muted">${esc(u.rules.join(', '))}</div>` : '');
  } else if (selected < 0){
    dtitle.textContent = t('detail.title');
    dbody.innerHTML = `<div class="empty">${esc(t('detail.empty_short'))}</div>`;
  }
  render();
}
ucclear.onclick = ()=> setUC(-1);
function exportStatus(){
  const eff = {};
  UCS.forEach(u=>{ if (stOverrides[u.name]) eff[u.name] = stOverrides[u.name]; });
  dtitle.textContent = t('export.title');
  dbody.innerHTML = `<p style="font-size:.78rem">${esc(t('export.body', {n: Object.keys(eff).length}))}</p>
    <textarea readonly style="width:100%;height:220px;background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:8px;font-family:'IBM Plex Mono',monospace;font-size:.68rem;padding:8px">${esc(JSON.stringify(eff, null, 1))}</textarea>`;
  const ta = dbody.querySelector('textarea'); if (ta){ ta.focus(); ta.select(); }
}
document.querySelector('#sidebar [data-exportst]').addEventListener('click', exportStatus);

// ==================== entry points panel ====================
// grouped by kind; the whole section (header included) disappears when the map has none
if (ENTRY_POINTS.length){
  ephdr.hidden = false;
  document.getElementById('epn').textContent = ENTRY_POINTS.length;
  let html = '';
  for (const kind of KINDS){
    const group = ENTRY_POINTS.map((ep,j)=>({ep, j})).filter(o=>o.ep.kind === kind);
    if (!group.length) continue;
    html += `<div class="kindhdr">${esc(t('kind.' + kind))} · ${group.length}</div>`;
    html += group.map(o=>
      `<button class="ep" data-ep="${o.j}">${esc(o.ep.label)}<br><span class="vw">` +
      esc((o.ep.symbol ? o.ep.symbol + ' · ' : '') + baseName(F[o.ep.i].p)) +
      `</span></button>`).join('');
  }
  eplist.innerHTML = html;
}
ephdr.addEventListener('click', function(){
  this.classList.toggle('closed');
  eplist.hidden = !eplist.hidden;
});
eplist.addEventListener('click', e=>{
  const b = e.target.closest('[data-ep]'); if (!b) return;
  activeEp = +b.dataset.ep;
  treeRoot = null;
  flowPick = 'ep';
  const ep = ENTRY_POINTS[activeEp];
  if (scene === 'ctx'){ render(); }        // Context: the entry point becomes a lens
  else if (scene === 'flow'){ render(); }  // Flow: redraw as this entry point's call tree
  else {
    if (scene !== 'pac') go('pac'); else render();
    selected = ep.i; paintState(); centerOn(ep.i);
  }
  entryDetail(activeEp);
});

// ==================== stars panel (most central files) ====================
// top 20 by ucCount desc, ties by impIn desc; muted categories (tests) stay out of the ranking
const starRank = F.map((_,i)=>i)
  .filter(i=> !isMutedCat(F[i].g))
  .sort((a,b)=> ucCount[b]-ucCount[a] || impIn[b]-impIn[a])
  .slice(0, 20);
document.getElementById('starn').textContent = starRank.length;
document.getElementById('starlist').innerHTML = starRank.map(i=>
  `<button class="star" data-star="${i}" title="${esc(F[i].p)}">
    <span class="dot" style="background:${CATCOLOR(F[i].g)}"></span>${esc(baseName(F[i].p))}<br>
    <span class="starnums">${esc(t('star.stats', {uc:ucCount[i], total:UCS.length, imp:impIn[i], calls:callIn[i]}))}</span></button>`).join('');
document.getElementById('starhdr').addEventListener('click', function(){
  this.classList.toggle('closed');
  const l = document.getElementById('starlist');
  l.hidden = !l.hidden;
});
document.getElementById('starlist').addEventListener('click', e=>{
  const b = e.target.closest('[data-star]'); if (!b) return;
  const i = +b.dataset.star;
  if (scene !== 'pac') go('pac');
  selectFile(i); centerOn(i);
});

// ==================== search ====================
const searchIndex = [];
F.forEach((f,i)=>{
  searchIndex.push({k:'file', t:f.p, i, sym:null});
  f.c.forEach(c=>{ searchIndex.push({k:'class', t:c[0]+' — '+f.p, i, sym:null});
    c[3].forEach(m=> searchIndex.push({k:'method', t:c[0]+'.'+m+' — '+f.p, i, sym:m})); });
  f.f.forEach(x=> searchIndex.push({k:'function', t:x[0]+' — '+f.p, i, sym:x[0]}));
});
input.addEventListener('input', ()=>{
  const q = input.value.trim().toLowerCase();
  searchHits = new Set();
  if (q.length < 2){ results.style.display='none'; paintState(); return; }
  const hits = [];
  for (const e of searchIndex){
    if (e.t.toLowerCase().includes(q)){ hits.push(e); if (hits.length > 400) break; }
  }
  hits.forEach(h=>{ if (pos[h.i]) searchHits.add(h.i); });
  results.innerHTML = hits.slice(0,12).map((h,z)=>
    `<button data-z="${z}"><span class="k">${esc(t('search.kind.' + h.k))}</span>${esc(h.t)}</button>`).join('') ||
    `<button disabled><span class="k">—</span>${esc(t('search.none'))}</button>`;
  results.style.display = 'block';
  results._hits = hits;
  paintState();
});
results.addEventListener('click', e=>{
  const b = e.target.closest('button[data-z]'); if (!b) return;
  const h = results._hits[+b.dataset.z];
  results.style.display = 'none';
  if (!visible(h.i)){ document.getElementById('tgtests').checked = true; showMuted = true; }
  if (h.sym){ go('file', {i:h.i, sym:h.sym}); symDetail(); }
  else { if (scene!=='pac') go('pac'); else render(); selectFile(h.i); centerOn(h.i); }
});
document.addEventListener('pointerdown', e=>{
  if (!results.contains(e.target) && e.target !== input) results.style.display = 'none';
});

// ==================== legend and toggles ====================
document.getElementById('legend').innerHTML = CATS.map(c=>
  `<span class="chip"><span class="sw" style="background:${catInfo.get(c.id).color}"></span>${esc(catInfo.get(c.id).label)}</span>`).join('');
const mutedCats = CATS.filter(c=>c.muted);
if (mutedCats.length){
  document.getElementById('mutedtgl').hidden = false;
  // the label comes from the config categories, so it is not part of UI_STRINGS
  document.getElementById('mutedlabel').textContent = mutedCats.map(c=>(c.label||c.id).toLowerCase()).join(' + ');
}
document.getElementById('tgtests').addEventListener('change', e=>{
  showMuted = e.target.checked; render(); fit();
});
document.getElementById('tgstars').addEventListener('change', e=>{
  showStars = e.target.checked;
  if (scene === 'pac') render();
});

// ==================== boot ====================
fillStaticStrings();
dtitle.textContent = t('detail.title');
document.getElementById('commitline').textContent =
  `${META.repo || ''} @ ${META.commit || '?'} · ${META.date || ''}`;
refreshUCChips();
render();
fit();
window.addEventListener('resize', fit);
})();
</script>
